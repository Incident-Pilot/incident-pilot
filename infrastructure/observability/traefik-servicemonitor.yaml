apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: observability
  labels: { release: kube-prom }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: traefik }
  namespaceSelector: { matchNames: ["kube-system"] }
  endpoints:
    - port: metrics
      interval: 30s
