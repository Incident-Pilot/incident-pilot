prometheus:
  prometheusSpec:
    retention: 12h
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits: { cpu: 500m, memory: 450Mi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: { storage: 5Gi }
    # scrape Traefik automatically via ServiceMonitor below
    additionalScrapeConfigs: []

alertmanager:
  alertmanagerSpec:
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 100m, memory: 128Mi }
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          resources:
            requests: { storage: 1Gi }
    secrets:
      - observation-gateway-webhook-credentials
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: "null"
          matchers:
            - alertname="Watchdog"
        - receiver: "observation-gateway"
    inhibit_rules:
      - source_matchers:
          - severity="critical"
        target_matchers:
          - severity=~"warning|info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - severity="warning"
        target_matchers:
          - severity="info"
        equal:
          - namespace
          - alertname
      - source_matchers:
          - alertname="InfoInhibitor"
        target_matchers:
          - severity="info"
        equal:
          - namespace
      - target_matchers:
          - alertname="InfoInhibitor"
    receivers:
      - name: "null"
      - name: "observation-gateway"
        webhook_configs:
          - url: "http://observation-gateway.incident-pilot-ecommerce.svc.cluster.local:8000/webhooks/alertmanager"
            send_resolved: false
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/observation-gateway-webhook-credentials/api-key

grafana:
  enabled: false   # we deploy Grafana separately in Step 2 so Loki/Tempo datasources are cleaner to manage

kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 50m, memory: 64Mi }
  hostNetwork: true
  hostPID: true
