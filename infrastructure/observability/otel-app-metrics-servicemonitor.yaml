apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector-app-metrics
  namespace: observability
  labels: { release: kube-prom }
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
  namespaceSelector: { matchNames: ["observability"] }
  endpoints:
    - port: prom-exporter
      interval: 30s
