# Requires a `gateway-credentials` Secret this manifest does NOT create —
# bootstrap it before applying, same discipline as postgres.yaml:
#
#   kubectl create secret generic gateway-credentials \
#     -n incident-pilot-ecommerce \
#     --from-literal=api-key="$(openssl rand -hex 32)"
#
# Save that generated key — it's also the value deploy.sh needs in
# INCIDENT_GATEWAY_API_KEY (this repo) and the ecommerce-cloudmart repo's
# own deploy.sh needs in the same-named var for its security-ingestion
# curls (Task 12), and whatever Alertmanager receiver config eventually
# points at this webhook.
#
# Resource requests/limits sized per the original node-memory guidance:
# gateway ~128-256Mi.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: observation-gateway
  namespace: incident-pilot-ecommerce
  labels:
    app: observation-gateway
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: observation-gateway
  template:
    metadata:
      labels:
        app: observation-gateway
    spec:
      serviceAccountName: observation-gateway
      containers:
        - name: observation-gateway
          image: localhost:5000/incident-pilot-ecommerce/observation-gateway:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: observation-gateway-config
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: dsn
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-credentials
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: observation-gateway
  namespace: incident-pilot-ecommerce
spec:
  selector:
    app: observation-gateway
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
