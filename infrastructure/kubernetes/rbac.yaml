# RBAC for the observation-gateway's read-only Kubernetes adapter
# (spec section 15: "Do NOT implement write operations in this phase" —
# this ClusterRole only ever grants get/list, never write verbs).
#
# Scoped as a ClusterRole, not a namespaced Role: the adapter calls the
# all-namespaces list methods (e.g. list_pod_for_all_namespaces()), and no
# namespaced Role/RoleBinding combination — no matter how many namespaces
# you add one for — can authorize that API call. Only a cluster-scoped
# Role can. This does mean read access (get/list only, no writes) extends
# to every namespace on the cluster, not just the ones currently in use;
# accepted for simplicity over chasing per-namespace Roles for each new
# namespace that appears.
#
# Deliberately scoped to only what's actually called today —
# `list_pods`/`list_events`/`get_deployment`/`list_services` (Context
# Builder, deployment collector, topology builder). `KubernetesClient`
# has methods for nodes/namespaces/configmaps/secrets/replicasets too,
# but nothing in the application calls them yet, so no RBAC is granted
# for them — widen this only when a real caller needs it, not ahead of
# time. (This also means the gateway's ServiceAccount can never read
# Secret *values* even by mistake — no `get`/`list` on `secrets` at all.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observation-gateway
  namespace: incident-pilot-ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: observation-gateway-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: observation-gateway-reader-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: observation-gateway-reader
subjects:
  - kind: ServiceAccount
    name: observation-gateway
    namespace: incident-pilot-ecommerce
