# RBAC for the observation-gateway's read-only Kubernetes adapter
# (spec section 15: "Do NOT implement write operations in this phase" —
# this ClusterRole/Role only ever grants get/list, never write verbs).
#
# Scoped as a namespaced Role in cloudmart-prod (not a ClusterRole) so the
# gateway can read that namespace's pods/events/deployments/services
# without cluster-wide access — a RoleBinding can bind a ServiceAccount
# from a *different* namespace (incident-pilot-ecommerce) as long as the
# Role/RoleBinding themselves live in the target namespace. This is a
# purely additive resource in cloudmart-prod (no existing CloudMart
# resource is modified), consistent with "preserve cloudmart-prod
# untouched" — same category of change as the earlier Alertmanager
# webhook config addition.
#
# Deliberately scoped to only what's actually called today —
# `list_pods`/`list_events`/`get_deployment`/`list_services` (Context
# Builder, deployment collector, topology builder). `KubernetesClient`
# has methods for nodes/namespaces/configmaps/secrets/replicasets too,
# but nothing in the application calls them yet, so no RBAC is granted
# for them — widen this only when a real caller needs it, not ahead of
# time. (This also means the gateway's ServiceAccount can never read
# Secret *values* even by mistake — no `get`/`list` on `secrets` at all.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observation-gateway
  namespace: incident-pilot-ecommerce
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observation-gateway-reader
  namespace: cloudmart-prod
rules:
  - apiGroups: [""]
    resources: ["pods", "events", "services"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observation-gateway-reader-binding
  namespace: cloudmart-prod
subjects:
  - kind: ServiceAccount
    name: observation-gateway
    namespace: incident-pilot-ecommerce
roleRef:
  kind: Role
  name: observation-gateway-reader
  apiGroup: rbac.authorization.k8s.io
